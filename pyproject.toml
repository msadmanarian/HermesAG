[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-ag"
version = "0.1.0"
description = "HermesAG: Autonomous Agentic Generation and Multi-Tier Cognitive Architecture Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sadman Arian", email = "msadmanarian@gmail.com" }
]
keywords = [
    "ai-agent",
    "hermes",
    "autonomous-agents",
    "memory-management",
    "obsidian",
    "mcp",
    "multi-agent",
    "ollama",
    "claude"
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
hermes = "hermes.gateways.cli:main"
